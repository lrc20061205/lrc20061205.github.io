      document.getElementById('status').textContent = '已停止';
      stopProgressUpdate();
      resetProgress();

    onend: function() {
      document.getElementById('status').textContent = '播放结束';
      stopProgressUpdate();
      // 确保进度条到 100%
      updateProgressBar(1);
    },
    
    onloaderror: function(id, error) {
